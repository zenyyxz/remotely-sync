user www-data;
worker_processes auto;
pid /run/nginx-remotely-sync-auth.pid;
error_log /var/log/nginx/remotely-sync-auth-error.log crit;

events {
    worker_connections 128;
}

http {
    access_log off;
    default_type application/octet-stream;
    server_tokens off;

    server {
        listen 80;
        server_name auth.lahirux.dev;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        location / {
            return 301 https://$host:8443$request_uri;
        }
    }

    server {
        listen 8443 ssl;
        server_name auth.lahirux.dev;
        client_max_body_size 8k;

        ssl_certificate /etc/letsencrypt/live/auth.lahirux.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/auth.lahirux.dev/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location = / {
            root /var/www/remotely-sync-auth;
            try_files /index.html =404;
        }

        location = /privacy {
            default_type text/html;
            alias /var/www/remotely-sync-auth/privacy.html;
        }

        location / {
            proxy_pass http://127.0.0.1:3080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
        }
    }
}
