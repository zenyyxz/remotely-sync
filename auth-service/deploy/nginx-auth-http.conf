user www-data;
worker_processes auto;
pid /run/nginx-remotely-sync-auth.pid;
error_log /var/log/nginx/remotely-sync-auth-error.log crit;

events {
    worker_connections 128;
}

http {
    access_log off;
    default_type application/octet-stream;
    server_tokens off;

    server {
        listen 80;
        server_name auth.lahirux.dev;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/html;
        }

        location / {
            return 404;
        }
    }
}
